<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Voting System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hero {
            min-height: calc(100vh - 72px);
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.9)),
                        url('photo-1529101091764-c3526daf38fe.avif') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--white);
            padding: 40px 20px;
        }

        .hero-content {
            max-width: 800px;
            animation: slideUp 0.6s ease;
        }

        .hero-badge {
            display: inline-block;
            padding: 8px 18px;
            background: rgba(37, 99, 235, 0.2);
            border: 1px solid rgba(37, 99, 235, 0.4);
            color: #93c5fd;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .hero h1 {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #60a5fa;
        }

        .hero p {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .hero a {
            padding: 15px 32px;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }

        .hero a.btn-primary-hero {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
        }

        .hero a.btn-primary-hero:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(37, 99, 235, 0.5);
        }

        .hero a.btn-secondary-hero {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .hero a.btn-secondary-hero:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 34px; letter-spacing: -1px; }
            .hero p { font-size: 16px; }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">Online Voting System</div>
        <div class="nav-links">
            <a href="home.html" class="active">Home</a>
            <a href="About.html">About</a>
            <a href="login.html">Login</a>
            <a href="result.html">Results</a>
            <a href="Register.html">Register</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <div class="hero-badge">🔐 Autenticação OTP Segura</div>
            <h1>Vote <span>Seguramente</span> de Qualquer Lugar</h1>
            <p>Sistema de votação online com autenticação por OTP, garantindo integridade e confidencialidade do seu voto.</p>
            <div class="hero-buttons">
                <a href="Register.html" class="btn-primary-hero">Começar Agora →</a>
                <a href="About.html" class="btn-secondary-hero">Saber Mais</a>
            </div>
        </div>
    </section>

</body>
</html>
