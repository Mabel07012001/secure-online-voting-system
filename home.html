<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Voting System</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(0,0,0,0.85);
            padding: 15px 30px;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: #00aaff;
        }

        .btn {
            background-color: #007bff;
            padding: 8px 15px;
            border-radius: 5px;
        }

        /* HERO SECTION */
        .hero {
            height: 90vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url('photo-1529101091764-c3526daf38fe.avif') no-repeat center center;

            background-size: cover;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .hero a {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .hero a:hover {
            background-color: #0056b3;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 32px;
            }

            .nav-links {
                gap: 10px;
                font-size: 14px;
            }
        }

    </style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

    <div class="logo">
        SecureVote
    </div>

    <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="login.html">Login</a>
        <a class="btn" href="register.html">Register</a>
    </div>

</div>

<!-- HERO SECTION -->
<section class="hero">

    <div>

        <h1>Secure Online Voting System</h1>

        <p>Vote securely from anywhere using OTP authentication.</p>

        <a href="register.html">Get Started</a>

    </div>

</section>

</body>
</html>
