<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Results — Online Voting System</title>
    
    <link rel="stylesheet" href="result.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">Online Voting System</div>
        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="result.html" class="active">Results</a>
        </div>
    </nav>

    <div class="page-header">
        <h1 class="page-title">Election Results</h1>
        <p class="page-subtitle">Online Presidential Election</p>
    </div>

    <main>

        <div class="summary">

            <div class="summary-card">
                <h3>Total Candidates</h3>
                <p id="totalCandidates">0</p>
            </div>

            <div class="summary-card">
                <h3>Total Votes</h3>
                <p id="totalVotes">0</p>
            </div>

            <div class="summary-card">
                <h3>Leading Candidate</h3>
                <p id="leadingCandidate">No votes yet</p>
            </div>

        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Position</th>
                        <th>Candidate</th>
                        <th>Party</th>
                        <th>Votes</th>
                        <th>Percentage</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 40px;">
                            Loading results...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <a href="dashboard.html" class="btn">← Back to Dashboard</a>
        </div>

    </main>

    <script type="module" src="result.js"></script>

</body>
</html>
